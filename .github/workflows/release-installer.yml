name: Release installer

# Attaches Transcribe-Setup.exe to a published release (scripts/release.sh). The exe is rebuilt only when
# installer/ changed since the newest earlier release carrying it; otherwise that exe is re-attached, so its
# hash (and SmartScreen reputation) carries over. Unsigned by decision (2026-09-26): setup runs the exe only once.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach (e.g. v1.2.0)
        required: true
      rebuild:
        description: Rebuild even if installer/ is unchanged since the previous release
        type: boolean
        default: false
      attach:
        description: Attach the exe to the release (false = dry-run build)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      EXE: dist/Transcribe-Setup.exe
      # Not `inputs.attach != false`: a release event has no inputs, and null == false after expression coercion.
      ATTACH: ${{ github.event_name == 'release' || inputs.attach }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          fetch-depth: 0 # the earlier release's tag for the installer/ diff

      # The workflow's own commit, not the tag's tree: a dry-run of an older tag predates the script.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci
          sparse-checkout: scripts/installer_reuse.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Rebuild or reuse the previous exe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE_REBUILD: ${{ inputs.rebuild == true }}
        run: bash .ci/scripts/installer_reuse.sh "$TAG" dist

      - name: Build the installer
        if: env.REBUILD == 'true'
        shell: cmd
        run: call installer\build_installer.bat < NUL

      - if: env.REBUILD == 'true' # a dry-run's exe, downloadable from the run
        uses: actions/upload-artifact@v7
        with:
          name: Transcribe-Setup
          path: ${{ env.EXE }}
          if-no-files-found: error

      - name: Attach to the release
        if: env.ATTACH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:TAG $env:EXE --clobber

      - name: SmartScreen submission reminder (rebuilt exe)
        if: env.REBUILD == 'true' && env.ATTACH == 'true'
        shell: pwsh
        run: >-
          Add-Content $env:GITHUB_STEP_SUMMARY "Unsigned Transcribe-Setup.exe attached to $env:TAG — submit it at https://www.microsoft.com/en-us/wdsi/filesubmission (Software developer → Microsoft Defender SmartScreen → Incorrectly detected)." #magic___^_^___line
      - name: Reuse note
        if: env.REBUILD == 'false'
        shell: pwsh
        run: >-
          Add-Content $env:GITHUB_STEP_SUMMARY "Reused Transcribe-Setup.exe from $env:REUSE_FROM (installer/ unchanged) — same hash, so no new SmartScreen submission is needed."
